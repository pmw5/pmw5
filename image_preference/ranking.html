<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Top Ranked Images</title>
  <meta name="color-scheme" content="dark" />
  <style>
    :root{
      --bg0:#070812;
      --bg1:#0b0d12;
      --card:rgba(18,22,37,.82);
      --text:#e8eef6;
      --muted:#9aa4b2;
      --border:rgba(255,255,255,.10);
      --accent:#7aa2ff;
      --good:#34d399;
      --warn:#fbbf24;
      --danger:#fb7185;
      --shadow:0 14px 60px rgba(0,0,0,.55);
      --r:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      background:
        radial-gradient(900px 500px at 15% 12%, rgba(122,162,255,.18), transparent 60%),
        radial-gradient(900px 500px at 85% 18%, rgba(52,211,153,.10), transparent 60%),
        linear-gradient(180deg,var(--bg0) 0%, var(--bg1) 45%, #090b10 100%);
      color:var(--text);
      overflow-x:hidden;
    }
    a{color:inherit}

    /* Header */
    header{
      position:sticky; top:0; z-index:50;
      backdrop-filter: blur(10px);
      background:rgba(11,13,18,.78);
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .bar{
      max-width:1200px; margin:0 auto;
      padding:14px 16px;
      display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    }
    .brand{
      display:flex; align-items:center; gap:10px; min-width:220px;
    }
    .mark{
      width:34px; height:34px; border-radius:12px;
      background:
        radial-gradient(18px 18px at 30% 30%, rgba(255,255,255,.22), transparent 60%),
        linear-gradient(135deg, rgba(122,162,255,.40), rgba(52,211,153,.18));
      border:1px solid rgba(255,255,255,.12);
      box-shadow:0 10px 24px rgba(0,0,0,.35);
    }
    h1{
      font-size:14px; margin:0; font-weight:850; letter-spacing:.2px;
    }
    .sub{font-size:12px; color:var(--muted); margin-top:2px}

    .controls{
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px; border-radius:999px;
      font-size:12px; color:var(--muted);
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.22);
    }
    .pill b{color:var(--text)}
    .btn{
      appearance:none; border:none; cursor:pointer;
      padding:9px 11px; border-radius:12px;
      font-size:12px; font-weight:850;
      color:var(--text);
      background:rgba(122,162,255,.18);
      border:1px solid rgba(122,162,255,.25);
    }
    .btn:hover{filter:brightness(1.06)}
    .btn.ghost{
      background:transparent;
      border:1px solid rgba(255,255,255,.12);
      color:var(--muted);
    }

    /* Layout */
    .wrap{max-width:1200px; margin:0 auto; padding:18px 16px 40px}
    .hero{
      display:grid;
      grid-template-columns: 1fr;
      gap:14px;
      margin-top:10px;
    }
    @media(min-width:980px){
      .hero{grid-template-columns: 1.1fr .9fr;}
    }

    .card{
      background:var(--card);
      border:1px solid rgba(255,255,255,.06);
      border-radius:var(--r);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .hd{padding:16px 16px 0}
    .bd{padding:16px}
    .kicker{
      font-size:12px; color:rgba(255,255,255,.86);
      font-weight:900; letter-spacing:.2px;
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    }
    .kicker .dot{
      width:9px; height:9px; border-radius:99px;
      background:var(--warn);
      box-shadow:0 0 0 4px rgba(251,191,36,.10);
    }
    .kicker.ok .dot{background:var(--good); box-shadow:0 0 0 4px rgba(52,211,153,.10)}
    .kicker.bad .dot{background:var(--danger); box-shadow:0 0 0 4px rgba(251,113,133,.10)}

    .bigTitle{
      margin:10px 0 0;
      font-size:22px;
      font-weight:950;
      letter-spacing:-.2px;
      line-height:1.15;
    }
    .bigDesc{margin:10px 0 0; color:var(--muted); font-size:13px; line-height:1.55}

    /* Tools */
    .tools{
      display:grid; grid-template-columns:1fr; gap:12px;
      margin-top:14px;
    }
    @media(min-width:760px){
      .tools{grid-template-columns:1.2fr .8fr;}
    }

    input, select{
      width:100%;
      padding:10px 11px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.28);
      color:var(--text);
      font-size:12px;
      outline:none;
    }
    input:focus, select:focus{
      border-color:rgba(122,162,255,.35);
      box-shadow:0 0 0 4px rgba(122,162,255,.12);
    }
    label{display:block; font-size:12px; color:var(--muted); margin:0 0 6px}
    .field{display:flex; flex-direction:column; gap:6px}

    /* Podium */
    .podium{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
    }
    @media(min-width:760px){
      .podium{grid-template-columns:1fr 1fr 1fr;}
    }
    .pod{
      position:relative;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.03);
      overflow:hidden;
      min-height:290px;
    }
    .pod::before{
      content:"";
      position:absolute; inset:-1px;
      background: radial-gradient(500px 240px at 30% 10%, rgba(122,162,255,.18), transparent 65%),
                  radial-gradient(400px 240px at 80% 30%, rgba(52,211,153,.10), transparent 65%);
      opacity:.85;
      pointer-events:none;
    }
    .podInner{position:relative; padding:12px}
    .rankTag{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px;
      border-radius:999px;
      font-size:12px; font-weight:950;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.30);
    }
    .rankTag .crown{
      width:16px; height:16px; display:inline-block;
      background:linear-gradient(135deg, rgba(255,255,255,.9), rgba(255,255,255,.2));
      -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="black" d="M5 16l-2-9l6 5l3-8l3 8l6-5l-2 9H5zm0 4v-2h14v2H5z"/></svg>') center / contain no-repeat;
      mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="black" d="M5 16l-2-9l6 5l3-8l3 8l6-5l-2 9H5zm0 4v-2h14v2H5z"/></svg>') center / contain no-repeat;
      opacity:.9;
    }

    .shot{
      margin-top:10px;
      border-radius:14px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.10);
      background:#000;
      aspect-ratio: 1 / 1;
      box-shadow:0 14px 38px rgba(0,0,0,.55);
      transform: translateZ(0);
    }
    .shot img{width:100%; height:100%; object-fit:cover; object-position:center; display:block}
    .meta{margin-top:10px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
    .name{min-width:0}
    .name .t{font-weight:950; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .name .s{font-size:12px; color:var(--muted); margin-top:4px}
    .score{
      text-align:right;
      font-size:12px;
      color:rgba(255,255,255,.90);
      font-weight:900;
      white-space:nowrap;
    }
    .score .mut{display:block; margin-top:3px; font-weight:800; color:var(--muted)}

    /* List */
    .listHd{
      display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap;
      margin-top:14px;
    }
    .listHd h2
