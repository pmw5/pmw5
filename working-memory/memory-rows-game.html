<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>5x5 Memory Rows Game</title>
  <link rel="stylesheet" href="../shared-kiosk-theme.css">
  <link rel="stylesheet" href="memory-rows-game.css">
</head>
<body class="kiosk-game working-memory-game">
  <div class="countFill" id="countFill" aria-hidden="true"></div>

  <div class="hud" aria-label="Game HUD">
    <div class="hudGroup">
      <div class="chip">
        <div class="label">Level</div>
        <div class="value" id="levelValue">1</div>
      </div>

      <div class="chip">
        <div class="label">Score</div>
        <div class="value" id="scoreValue">0</div>
      </div>
    </div>

    <div class="chip spotlightChip timerChip" id="timerChip" aria-label="Timer">
      <div class="label">Timer</div>
      <div class="big" id="timerNumber">5</div>
    </div>

    <div class="livesPanel" aria-label="Lives">
      <div class="lives">
        <div class="life" data-life="0">&#10084;&#65039;</div>
        <div class="life" data-life="1">&#10084;&#65039;</div>
        <div class="life" data-life="2">&#10084;&#65039;</div>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="modal show" id="levelModal" aria-label="Game message">
      <div class="modalCard">
        <h3 class="modalTitle" id="modalTitle"></h3>
        <p class="modalText" id="modalText"></p>
        <p class="scoreLabel" id="scoreLabel"></p>
        <p class="modalScore" id="modalScore"></p>
        <button class="modalBtn" id="startLevelBtn" type="button">Start Game</button>
      </div>
    </div>

    <div class="gridWrap surfacePanel" id="gridWrap">
      <div class="grid" id="grid" aria-label="5 by 5 button grid"></div>

      <div class="wait" id="waitOverlay" aria-hidden="true">
        <div class="waitText">WAIT</div>
      </div>
    </div>
  </div>

  <script src="memory-rows-game.js"></script>
</body>
</html>
