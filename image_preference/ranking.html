<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leaderboard Display</title>
  <meta name="color-scheme" content="dark" />
  <style>
    :root{
      --bg0:#060611;
      --bg1:#0b0d12;
      --card:rgba(18,22,37,.70);
      --text:#e8eef6;
      --muted:#9aa4b2;
      --border:rgba(255,255,255,.10);
      --shadow:0 18px 70px rgba(0,0,0,.55);
      --r:22px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      color:var(--text);
      background:
        radial-gradient(1100px 700px at 18% 8%, rgba(122,162,255,.16), transparent 60%),
        radial-gradient(1100px 700px at 82% 10%, rgba(52,211,153,.10), transparent 60%),
        linear-gradient(180deg,var(--bg0) 0%, var(--bg1) 55%, #090b10 100%);
      overflow:hidden; /* kiosk style */
      user-select:none;
      -webkit-user-select:none;
      -ms-user-select:none;
    }

    /* Top banner (no controls) */
    header{
      height:92px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 26px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background:rgba(11,13,18,.62);
      backdrop-filter: blur(10px);
    }
    .brand{
      display:flex; align-items:center; gap:14px;
      min-width:320px;
    }
    .mark{
      width:44px; height:44px; border-radius:16px;
      background:
        radial-gradient(24px 24px at 30% 30%, rgba(255,255,255,.22), transparent 60%),
        linear-gradient(135deg, rgba(122,162,255,.40), rgba(52,211,153,.18));
      border:1px solid rgba(255,255,255,.12);
      box-shadow:0 12px 30px rgba(0,0,0,.35);
    }
    .title{
      font-size:20px;
      font-weight:950;
      letter-spacing:-.2px;
      margin:0;
      line-height:1.05;
    }
    .sub{
      margin-top:6px;
      font-size:13px;
      color:var(--muted);
    }
    .stats{
      display:flex; align-items:center; gap:14px; flex-wrap:wrap;
      font-size:13px;
      color:var(--muted);
      text-align:right;
    }
    .stats b{color:var(--text)}
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.22);
      white-space:nowrap;
    }

    /* Main layout: podium + ranked wall */
    .wrap{
      height:calc(100% - 92px);
      padding:22px 22px 24px;
      display:grid;
      grid-template-columns: 1.1fr 1.4fr;
      gap:18px;
    }

    /* Left: huge podium (top 3) */
    .podium{
      height:100%;
      border-radius:var(--r);
      border:1px solid rgba(255,255,255,.08);
      background:var(--card);
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-width:0;
    }
    .podiumHead{
      padding:16px 18px 10px;
      display:flex; justify-content:space-between; align-items:flex-end; gap:12px;
    }
    .podiumHead h2{
      margin:0;
      font-size:14px;
      letter-spacing:.2px;
      font-weight:950;
      color:rgba(255,255,255,.92);
    }
    .podiumHead .hint{
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
    }
    .podiumGrid{
      flex:1;
      display:grid;
      grid-template-columns:1fr;
      grid-template-rows: 1.05fr .95fr .95fr;
      gap:14px;
      padding:12px 14px 16px;
      min-height:0;
    }
    .pod{
      border-radius:20px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.18);
      overflow:hidden;
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      min-height:0;
    }
    .shot{
      position:relative;
      background:#000;
      min-height:0;
    }
    .shot img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      display:block;
    }
    .meta{
      padding:14px 14px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap:10px;
      min-width:0;
    }
    .rankTag{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:8px 12px;
      border-radius:999px;
      font-size:14px;
      font-weight:950;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      width:max-content;
    }
    .name{
      font-weight:950;
      font-size:18px;
      letter-spacing:-.2px;
      line-height:1.15;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .small{
      font-size:13px;
      color:var(--muted);
      margin-top:6px;
    }
    .score{
      display:flex; flex-direction:column; gap:6px;
      align-items:flex-start;
      font-size:14px;
      color:rgba(255,255,255,.92);
      font-weight:900;
    }
    .score .mut{color:var(--muted); font-weight:800}

    /* Right: ranked wall (big tiles) */
    .wall{
      height:100%;
      border-radius:var(--r);
      border:1px solid rgba(255,255,255,.08);
      background:var(--card);
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-width:0;
    }
    .wallHead{
      padding:16px 18px 10px;
      display:flex; justify-content:space-between; align-items:flex-end; gap:12px;
    }
    .wallHead h2{
      margin:0;
      font-size:14px;
      letter-spacing:.2px;
      font-weight:950;
      color:rgba(255,255,255,.92);
    }
    .wallHead .hint{
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
    }
    .grid{
      flex:1;
      padding:12px 14px 16px;
      display:grid;
      gap:14px;
      min-height:0;
      /* big tiles, adapts to resolution */
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-rows: 1fr;
    }

    .tile{
      border-radius:20px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.18);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:0;
    }
    .thumb{
      position:relative;
      flex:1;
      background:#000;
      min-height:0;
    }
    .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      display:block;
    }
    .cap{
      padding:12px 12px 12px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
    }
    .cap .left{
      min-width:0;
    }
    .cap .t{
      font-weight:950;
      font-size:14px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      letter-spacing:-.15px;
    }
    .cap .s{
      margin-top:6px;
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .cap .right{
      text-align:right;
      white-space:nowrap;
      font-size:13px;
      font-weight:950;
      color:rgba(255,255,255,.92);
    }
    .cap .right .mut{
      display:block;
      margin-top:6px;
      font-weight:800;
      color:var(--muted);
      font-size:12px;
    }

    /* Responsive: if display is narrow, stack */
    @media(max-width:1100px){
      .wrap{grid-template-columns:1fr; overflow:auto}
      body{overflow:auto}
      .grid{grid-template-columns: repeat(2, minmax(0, 1fr));}
    }
    @media(max-width:720px){
      .grid{grid-template-columns:1fr;}
      header{height:auto; padding:16px}
      .wrap{height:auto}
    }

    /* “No interaction” polish: remove focus outlines */
    :focus{outline:none}
  </style>
</head>

<body>
<header>
  <div class="brand">
    <div class="mark" aria-hidden="true"></div>
    <div>
      <div class="title">Leaderboard</div>
      <div class="sub" id="subtitle">Loading…</div>
    </div>
  </div>

  <div class="stats">
    <span class="pill">ns=<b id="nsVal">default</b></span>
    <span class="pill"><b id="imgCount">0</b> images</span>
    <span class="pill"><b id="voteCount">0</b> votes</span>
    <span class="pill">Updated <b id="updatedAt">—</b></span>
  </div>
</header>

<div class="wrap">
  <section class="podium">
    <div class="podiumHead">
      <h2>Top 3</h2>
      <div class="hint">Elo computed from votes</div>
    </div>
    <div class="podiumGrid" id="podium"></div>
  </section>

  <section class="wall">
    <div class="wallHead">
      <h2>Ranked</h2>
      <div class="hint" id="wallHint">Top 9</div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<!-- Supabase (primary) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
        onerror="window.__sb_cdn_failed=true"></script>
<!-- Supabase (fallback) -->
<script>
  (function(){
    function addFallback(){
      const s = document.createElement('script');
      s.src = "https://unpkg.com/@supabase/supabase-js@2";
      s.async = true;
      document.head.appendChild(s);
    }
    if (window.__sb_cdn_failed) addFallback();
    setTimeout(() => { if (!window.supabase) addFallback(); }, 250);
  })();
</script>

<script>
  /************************************************************
   * BIG-SCREEN LEADERBOARD (Option A)
   * - No user interaction (no inputs/buttons).
   * - Reads public images + public votes, computes Elo client-side.
   ************************************************************/

  // === Your Supabase project ===
  const SUPABASE_URL = "https://rvhzustlabdqtbyrmucr.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_79bmlNeUgShdjcC-G9qIdw__nkmKXAV";

  // Namespace (keep, even if you don't filter yet)
  const qs = new URLSearchParams(location.search);
  const NS = (qs.get('ns') || 'default').trim() || 'default';

  // Elo config
  const START_ELO = 1000;
  const K = 32;

  // Display config
  const WALL_COUNT = 9;        // how many tiles on the right
  const REFRESH_MS = 15000;    // passive auto-refresh for live events

  // UI
  const subtitle = document.getElementById('subtitle');
  const nsVal = document.getElementById('nsVal');
  const imgCount = document.getElementById('imgCount');
  const voteCount = document.getElementById('voteCount');
  const updatedAt = document.getElementById('updatedAt');
  const wallHint = document.getElementById('wallHint');

  const podiumEl = document.getElementById('podium');
  const gridEl = document.getElementById('grid');

  nsVal.textContent = NS;
  wallHint.textContent = `Top ${WALL_COUNT}`;

  let sb;

  init();

  async function init(){
    const okLib = await waitForSupabase(2500);
    if (!okLib){
      subtitle.textContent = "Supabase library failed to load (check blockers/CDN).";
      return;
    }

    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // First load, then passive loop
    await loadAndRender();
    setInterval(loadAndRender, REFRESH_MS);
  }

  async function loadAndRender(){
    subtitle.textContent = "Loading…";

    const images = await loadImages();
    if (!images) return;

    const votes = await loadVotes();
    if (!votes) return;

    imgCount.textContent = String(images.length);
    voteCount.textContent = String(votes.length);

    const rows = computeElo(images, votes);
    render(rows);

    updatedAt.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    subtitle.textContent = "Live rankings";
  }

  async function loadImages(){
    let q = sb.from('images').select('*').eq('active', true);
    // If you later add a namespace column, uncomment:
    // q = q.eq('namespace', NS);

    const { data, error } = await q;
    if (error){
      subtitle.textContent = "Could not load images (check RLS policy).";
      return null;
    }
    return (data || []).filter(x => x?.id && x?.url).map(x => ({
      ...x,
      name: x.name || "Untitled"
    }));
  }

  async function loadVotes(){
    let q = sb.from('votes').select('winner_id,loser_id,created_at').order('created_at', { ascending: true });
    // If you later add a namespace column, uncomment:
    // q = q.eq('namespace', NS);

    const { data, error } = await q;
    if (error){
      subtitle.textContent = "Votes are not publicly readable (Option A policy missing).";
      return null;
    }
    return (data || []).filter(v => v?.winner_id && v?.loser_id);
  }

  function computeElo(images, votes){
    const r = Object.create(null);
    for (const img of images){
      r[img.id] = { elo: START_ELO, wins: 0, losses: 0 };
    }

    for (const v of votes){
      if (!r[v.winner_id] || !r[v.loser_id]) continue;
      applyElo(r, v.winner_id, v.loser_id, K);
    }

    return images.map(img => {
      const rr = r[img.id] || { elo: START_ELO, wins: 0, losses: 0 };
      const games = rr.wins + rr.losses;
      return { img, elo: rr.elo, wins: rr.wins, losses: rr.losses, games };
    }).sort((a,b) => b.elo - a.elo);
  }

  function applyElo(ratings, winnerId, loserId, K){
    const w = ratings[winnerId];
    const l = ratings[loserId];

    const expectedW = 1 / (1 + Math.pow(10, (l.elo - w.elo) / 400));
    const expectedL = 1 - expectedW;

    w.elo = w.elo + K * (1 - expectedW);
    l.elo = l.elo + K * (0 - expectedL);

    w.wins += 1;
    l.losses += 1;
  }

  function render(rows){
    // Podium (Top 3)
    const top3 = rows.slice(0,3);

    podiumEl.innerHTML = "";
    for (let i=0; i<3; i++){
      const row = top3[i] || null;
      podiumEl.appendChild(makePod(i+1, row));
    }

    // Wall (next N)
    const wall = rows.slice(3, 3 + WALL_COUNT);
    gridEl.innerHTML = "";
    for (let i=0; i<wall.length; i++){
      gridEl.appendChild(makeTile(i+4, wall[i]));
    }
  }

  function makePod(rank, row){
    const el = document.createElement('div');
    el.className = 'pod';

    const shot = document.createElement('div');
    shot.className = 'shot';
    const img = document.createElement('img');
    img.loading = 'eager';
    img.alt = row?.img?.name || `Rank ${rank}`;
    img.src = row?.img?.url || '';
    shot.appendChild(img);

    const meta = document.createElement('div');
    meta.className = 'meta';

    const tag = document.createElement('div');
    tag.className = 'rankTag';
    tag.textContent = `#${rank}`;

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = row?.img?.name || "—";

    const small = document.createElement('div');
    small.className = 'small';
    small.textContent = row ? shortId(row.img.id) : "Waiting for votes…";

    const score = document.createElement('div');
    score.className = 'score';
    score.innerHTML = row
      ? `${Math.round(row.elo)} Elo <span class="mut">· ${row.wins}-${row.losses} · ${row.games} games</span>`
      : `<span class="mut">—</span>`;

    meta.appendChild(tag);
    meta.appendChild(name);
    meta.appendChild(small);
    meta.appendChild(score);

    el.appendChild(shot);
    el.appendChild(meta);
    return el;
  }

  function makeTile(rank, row){
    const el = document.createElement('div');
    el.className = 'tile';

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = row.img.name;
    img.src = row.img.url;
    thumb.appendChild(img);

    const cap = document.createElement('div');
    cap.className = 'cap';

    const left = document.createElement('div');
    left.className = 'left';
    left.innerHTML =
      `<div class="t">#${rank} · ${escapeHtml(row.img.name)}</div>` +
      `<div class="s">${escapeHtml(shortId(row.img.id))}</div>`;

    const right = document.createElement('div');
    right.className = 'right';
    right.innerHTML =
      `${Math.round(row.elo)} Elo` +
      `<span class="mut">${row.wins}-${row.losses}</span>`;

    cap.appendChild(left);
    cap.appendChild(right);

    el.appendChild(thumb);
    el.appendChild(cap);
    return el;
  }

  async function waitForSupabase(timeoutMs){
    const start = Date.now();
    while (Date.now() - start < timeoutMs) {
      if (window.supabase?.createClient) return true;
      await new Promise(r => setTimeout(r, 50));
    }
    return !!window.supabase?.createClient;
  }

  function shortId(id){ return (id || "").slice(0, 8); }
  function escapeHtml(s){
    return String(s)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }
</script>
</body>
</html>
